<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Fluency"/>
<title>Fluency Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --night:#161a35; --night-2:#22265a;
    --parchment:#fdf6e8; --parchment-2:#f4e9d0;
    --gold:#f0ac3f; --coral:#ff6f59; --teal:#49c6b8;
    --ink:#2b2440; --muted:#8b8298;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:'Nunito', sans-serif; background: var(--night); color: var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px; overflow-x:hidden;
  }
  ::-webkit-scrollbar{ width:3px; }
  ::-webkit-scrollbar-thumb{ background:#00000022; border-radius:2px; }

  @keyframes float{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-14px) rotate(2deg);} }
  @keyframes pulseAlert{ 0%{ box-shadow: inset 0 0 0 0 rgba(220,60,50,0); } 30%{ box-shadow: inset 0 0 60px 10px rgba(220,60,50,.35); } 100%{ box-shadow: inset 0 0 0 0 rgba(220,60,50,0); } }
  @keyframes pulseTriumphant{ 0%{ box-shadow: inset 0 0 0 0 rgba(240,172,63,0); } 30%{ box-shadow: inset 0 0 70px 12px rgba(240,172,63,.4); } 100%{ box-shadow: inset 0 0 0 0 rgba(240,172,63,0); } }
  .scene.pulse-alert{ animation: pulseAlert 900ms ease-out; }
  .scene.pulse-triumphant{ animation: pulseTriumphant 1100ms ease-out; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0); opacity:.4} 30%{transform:translateY(-5px); opacity:1} }
  @keyframes pulseMic{ 0%,100%{box-shadow:0 0 0 0 rgba(255,111,89,.5);} 50%{box-shadow:0 0 0 8px rgba(255,111,89,0);} }

  #app{
    width:100%; max-width:480px; height:min(860px, 96vh); height:min(860px, calc(var(--vvh, 100vh) - 24px));
    background: var(--parchment); border-radius:28px; overflow:hidden;
    display:flex; flex-direction:column; position:relative;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05);
  }

  /* ---------- PASSWORD ---------- */
  #password-screen{
    position:fixed; inset:0; background: var(--night); z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  }
  #password-screen h2{ font-family:'Fredoka',sans-serif; font-size:24px; color:#fdf6e8; letter-spacing:.04em; }
  #password-screen p{ color:#8b93c9; font-size:13px; }
  #pass-input{
    background:#1d2150; border:1.5px solid #33397a; border-radius:12px;
    padding:12px 20px; color:#fdf6e8; font-size:20px; letter-spacing:.35em;
    font-family:'Nunito',sans-serif; text-align:center; width:180px;
  }
  #pass-input:focus{ outline:none; border-color: var(--gold); }
  #pass-btn{
    background: var(--gold); border:none; border-radius:14px; color:#20163a;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px;
    padding:12px 30px; cursor:pointer;
  }
  #pass-error{ color: var(--coral); font-size:12px; display:none; font-weight:700; }

  /* ---------- SCENE ---------- */
  .scene{
    position:relative; height:36%; min-height:200px; overflow:hidden; flex-shrink:0;
    background: radial-gradient(circle at 50% 30%, var(--night-2), var(--night) 75%);
    transition: background 900ms ease;
    display:flex; align-items:center; justify-content:center;
  }
  .scene .icon{
    font-size:80px; filter: drop-shadow(0 10px 30px rgba(0,0,0,.5));
    animation: float 4.5s ease-in-out infinite; z-index:3;
  }
  .particle{ position:absolute; border-radius:50%; opacity:.7; pointer-events:none; }
  .scene-caption{
    position:absolute; bottom:12px; left:0; right:0; text-align:center;
    font-family:'Fredoka', sans-serif; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; font-size:10.5px; color:rgba(255,255,255,.55); z-index:3;
  }
  .thread{ position:absolute; top:14px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:4; }
  .bead{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.22); transition:all 300ms ease; }
  .bead.lit{ background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .mute-btn{
    position:absolute; top:12px; right:14px; z-index:5;
    background: rgba(255,255,255,.12); border:none; border-radius:999px;
    width:34px; height:34px; font-size:16px; cursor:pointer; color:#fff;
  }

  /* ---------- STORY PANEL ---------- */
  .panel{
    flex:1; overflow-y:auto; padding:22px 20px 14px;
    background: linear-gradient(180deg, var(--parchment), var(--parchment-2));
  }
  .msg{ margin-bottom:16px; animation: rise 400ms ease; }
  .narrator{
    font-family:'Fredoka', sans-serif; font-size:16.5px; line-height:1.55;
    border-left:3px solid var(--gold); padding-left:12px;
  }
  .speak-line{ background:transparent; border:none; cursor:pointer; font-size:14px; opacity:.5; margin-top:4px; padding-left:12px; }
  .user-line{ display:flex; justify-content:flex-end; }
  .user-bubble{
    background: var(--night); color:#fff; padding:10px 15px;
    border-radius:16px 16px 4px 16px; max-width:80%; font-weight:700; font-size:15px;
  }
  .typing{ display:flex; gap:4px; padding-left:12px; }
  .typing span{ width:6px; height:6px; border-radius:50%; background: var(--gold); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }

  /* ---------- SPARK ---------- */
  .spark{ padding:8px 4px 4px; }
  .spark h2{ font-family:'Fredoka',sans-serif; font-size:20px; margin-bottom:4px; }
  .spark p{ color:#6b6280; font-size:14px; margin-bottom:14px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:none; background:#fff; padding:9px 14px; border-radius:999px;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; cursor:pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,.08); transition: transform 120ms ease;
  }
  .chip:hover{ transform: translateY(-2px); }
  #continue-wrap{ margin-top:16px; display:flex; flex-direction:column; gap:6px; }
  #continue-btn{
    background:transparent; border:1.5px solid #00000022; border-radius:999px;
    color:#6b6280; font-family:'Nunito',sans-serif; font-weight:700; font-size:13px;
    padding:9px 16px; cursor:pointer; width:fit-content;
  }
  #continue-info{ font-size:11px; color:#a89fbe; }

  /* ---------- INPUT ---------- */
  .inputbar{ display:none; gap:8px; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--parchment-2); border-top:1px solid rgba(0,0,0,.06); }
  .inputbar input{
    flex:1; border:none; border-radius:14px; padding:12px 14px; font-size:15px;
    font-family:'Nunito',sans-serif; background:#fff; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.05);
  }
  .inputbar input:focus{ outline:2px solid var(--gold); }
  .inputbar button{ background: var(--coral); color:#fff; border:none; border-radius:14px; padding:0 18px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:15px; cursor:pointer; }
  .inputbar button:disabled{ opacity:.5; cursor:default; }
  #mic-btn{
    background:#fff; border:none; border-radius:14px; width:46px; font-size:18px; cursor:pointer;
    flex-shrink:0; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.05); transition: background 150ms ease, transform 150ms ease;
  }
  #mic-btn.listening{ background: var(--coral); transform: scale(1.06); animation: pulseMic 1s infinite; }
  #mic-hint{ position:absolute; bottom:76px; left:0; right:0; text-align:center; font-size:11px; color: var(--coral); font-weight:700; display:none; pointer-events:none; }
  #mic-hint.visible{ display:block; }

  .end-card{ text-align:center; padding:26px 10px; font-family:'Fredoka',sans-serif; }
  .end-card .icon{ font-size:40px; }
  .restart{ margin-top:12px; background: var(--teal); border:none; color:#fff; padding:10px 20px; border-radius:999px; font-family:'Fredoka',sans-serif; font-weight:600; cursor:pointer; }

  /* keyboard open: pin the card to the top and keep Juno visible, just smaller */
  body.kb{ align-items:flex-start; padding-top:8px; }
  #app.stage-mode.kb .scene{ height:46%; }
  /* ---------- STAGE (v5: animated Juno, pirate world) ---------- */
  #app.stage-mode .scene{ height:58%; }
  #app.stage-mode .scene .icon, #app.stage-mode .scene .scene-caption, #app.stage-mode .particle{ display:none; }
  .stage{ position:absolute; inset:0; overflow:hidden; background:#1b120b; display:none; z-index:2; }
  #app.stage-mode .stage{ display:block; }
  .stage .world{ position:absolute; }
  .stage .layer{ position:absolute; inset:0; }
  .stage .zoomL{ transition: transform 1.4s cubic-bezier(.3,.6,.2,1); transform-origin: 50% 32%; }
  .stage .zoomL.close{ transform: scale(1.3); }
  @keyframes stShake{ 0%,100%{transform:translate(0,0)} 15%{transform:translate(-1.2%,.6%)} 30%{transform:translate(1.1%,-.5%)} 45%{transform:translate(-.8%,.4%)} 60%{transform:translate(.6%,-.3%)} 80%{transform:translate(-.3%,.2%)} }
  .stage .shakeL.on{ animation: stShake .55s ease-out; }
  @keyframes kenburns{ from{ transform: scale(1) translate(0,0); } to{ transform: scale(1.045) translate(-.7%,-.5%); } }
  .stage .camL{ animation: kenburns 26s ease-in-out infinite alternate; transform-origin: 50% 45%; }
  .stage .bgimg{ width:100%; height:100%; display:block; user-select:none; -webkit-user-drag:none; }
  .stage .glow{ background: radial-gradient(circle at 34.4% 13.3%, rgba(255,196,110,.42) 0%, rgba(255,170,80,.14) 22%, rgba(255,150,60,0) 42%); mix-blend-mode: screen; pointer-events:none; transition: opacity .12s linear; }
  .stage canvas{ width:100%; height:100%; pointer-events:none; }
  .stage .dark{ background: rgba(8,6,20,.82); opacity:0; transition: opacity .25s ease; pointer-events:none; }
  .stage .vig{ background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); pointer-events:none; }
  .stage .flash{ background:#fff; opacity:0; pointer-events:none; }
  @keyframes stFlash{ 0%{opacity:0} 8%{opacity:.85} 16%{opacity:.1} 26%{opacity:.7} 60%{opacity:0} 100%{opacity:0} }
  .stage .flash.on{ animation: stFlash .9s ease-out; }
  .stage .juno{ position:absolute; left:32%; width:36%; bottom:6.5%; aspect-ratio: 431 / 1100; }
  .stage .jE, .stage .jB, .stage .jR{ position:absolute; inset:0; transform-origin: 50% 100%; }
  .stage .jR{ animation: breath 3.6s ease-in-out infinite, sway 7.5s ease-in-out infinite; }
  .stage .jR.slow{ animation-duration: 5.5s, 9s; }
  @keyframes breath{ 0%,100%{ scale: 1 1; } 50%{ scale: .996 1.012; } }
  @keyframes sway{ 0%,100%{ rotate: -.4deg; } 50%{ rotate: .4deg; } }
  .stage .spr{ position:absolute; inset:0; width:100%; height:100%; opacity:0; transition: opacity .16s linear; user-select:none; -webkit-user-drag:none; }
  .stage .spr.instant{ transition:none; }
  .stage .jE.e-scared{ animation: tremble .09s linear infinite alternate; }
  @keyframes tremble{ from{ translate:-0.35% 0; } to{ translate:.35% 0; } }
  .stage .jE.e-excited{ animation: bounce .42s ease-out 3; }
  @keyframes bounce{ 0%,100%{ translate:0 0; } 45%{ translate:0 -3.2%; } }
  .stage .jE.e-happy{ animation: hop .55s ease-out 1; }
  @keyframes hop{ 0%,100%{ translate:0 0; } 40%{ translate:0 -2%; } }
  .stage .jE.e-surprised{ animation: jump .38s cubic-bezier(.2,.8,.3,1) 1; }
  @keyframes jump{ 0%{ translate:0 0; } 35%{ translate:0 -2.6%; } 100%{ translate:0 0; } }
  .stage .jE.e-sad, .stage .jE.e-confess{ translate:0 .8%; transition: translate .6s ease; }
  .stage .jE.e-shy{ animation: shysway 2.4s ease-in-out infinite; }
  @keyframes shysway{ 0%,100%{ rotate:-1deg; } 50%{ rotate:1deg; } }
</style>
</head>
<body>

<div id="password-screen">
  <div style="font-size:48px">🎙️</div>
  <h2>FLUENCY ENGINE</h2>
  <p>Enter access code to continue</p>
  <input id="pass-input" type="text" inputmode="numeric" autocomplete="off" style="-webkit-text-security:disc" placeholder="••••" maxlength="4" onkeydown="if(event.key==='Enter') checkPass()"/>
  <button id="pass-btn" onclick="checkPass()">ENTER →</button>
  <div id="pass-error">Wrong code. Try again.</div>
</div>

<div id="app">
  <div class="scene" id="scene">
    <div class="stage" id="stage">
      <div class="world" id="stWorld">
        <div class="layer zoomL" id="stZoom"><div class="layer shakeL" id="stShake"><div class="layer camL">
          <img class="bgimg" id="stBg" alt=""/>
          <div class="layer glow" id="stGlow"></div>
          <canvas class="layer" id="stDust"></canvas>
          <div class="juno"><div class="jE" id="stE"><div class="jB" id="stB"><div class="jR" id="stR"></div></div></div></div>
          <div class="layer dark" id="stDark"></div>
          <div class="layer vig"></div>
        </div></div></div>
      </div>
      <div class="layer flash" id="stFlash"></div>
    </div>
    <div class="thread" id="thread"></div>
    <button class="mute-btn" id="muteBtn" title="Toggle narrator voice">🔊</button>
    <div class="icon" id="sceneIcon">📖</div>
    <div class="scene-caption" id="sceneCaption">your story is waiting</div>
  </div>
  <div class="panel" id="panel"></div>
  <div class="inputbar" id="inputbar">
    <button id="mic-btn" title="Speak your move">🎤</button>
    <input id="userInput" type="text" placeholder="Type what you do or say…"/>
    <button id="sendBtn">Go</button>
  </div>
  <div id="mic-hint">🔴 Listening… tap again when done</div>
</div>

<script>
const SUPABASE_URL = "https://gvpuyyycfnjdjevdpxqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nPodW5LfPGHCsaNI71KW6Q_X6UqL4-_";
const MAX_TURNS = 18;
const SILENCE_MARK = '[silence]';

// Silence ladder (ms). Counted from the moment the narrator finished speaking.
// index 0: until level 1 (easier question), 1: until level 2 (small world event), 2: until level 3 (sleep)
const IDLE_DELAYS = [18000, 17000, 25000];

const THEMES = {
  pirate:  { bg:'radial-gradient(circle at 50% 25%, #1a4d63, #0c2431 75%)', icon:'🏴‍☠️', caption:'the high seas', particle:'wave' },
  ocean:   { bg:'radial-gradient(circle at 50% 25%, #0c5b73, #0a2333 75%)', icon:'🌊', caption:'deep blue world', particle:'wave' },
  forest:  { bg:'radial-gradient(circle at 50% 25%, #1f4d2e, #0f2417 75%)', icon:'🌲', caption:'the whispering woods', particle:'leaf' },
  space:   { bg:'radial-gradient(circle at 50% 25%, #2b1d5e, #0b0a24 75%)', icon:'🚀', caption:'far beyond the stars', particle:'star' },
  mystery: { bg:'radial-gradient(circle at 50% 25%, #3a2a4d, #171022 75%)', icon:'🔦', caption:'something is hidden here', particle:'star' },
  castle:  { bg:'radial-gradient(circle at 50% 25%, #5c2a3a, #200e17 75%)', icon:'🏰', caption:'the old kingdom', particle:'star' },
  city:    { bg:'radial-gradient(circle at 50% 25%, #2a3a5c, #0d1424 75%)', icon:'🌆', caption:'the city never sleeps', particle:'star' },
  dragon:  { bg:'radial-gradient(circle at 50% 25%, #5c3a1a, #241505 75%)', icon:'🐉', caption:'here be dragons', particle:'ember' },
  default: { bg:'radial-gradient(circle at 50% 30%, #22265a, #161a35 75%)', icon:'📖', caption:'your story is waiting', particle:'star' },
};

let state = { turn:0, theme:'default', mood:'calm', history:[], world:null, sid:null };

const panel = document.getElementById('panel');
const scene = document.getElementById('scene');
const sceneIcon = document.getElementById('sceneIcon');
const sceneCaption = document.getElementById('sceneCaption');
const thread = document.getElementById('thread');
const inputbar = document.getElementById('inputbar');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('mic-btn');
const muteBtn = document.getElementById('muteBtn');

function newSid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

// ── PASSWORD ──────────────────────────────────────────────────
function checkPass(){
  const val = document.getElementById('pass-input').value;
  if(val === '1982'){
    document.getElementById('password-screen').style.display = 'none';
    showSpark();
  } else {
    document.getElementById('pass-error').style.display = 'block';
    document.getElementById('pass-input').value = '';
    document.getElementById('pass-input').focus();
  }
}

// ── SCENE / PROGRESS ──────────────────────────────────────────
function renderThread(){
  thread.innerHTML = '';
  const dots = 10;
  const lit = Math.round((state.turn / MAX_TURNS) * dots);
  for(let i=0;i<dots;i++){
    const b = document.createElement('div');
    b.className = 'bead' + (i < lit ? ' lit' : '');
    thread.appendChild(b);
  }
}
const MOOD_PARTICLE_FACTOR = { calm:1, alert:1.5, excited:1.7, scared:1.4, triumphant:1.3, mysterious:0.7 };
const MOOD_SPEED_FACTOR = { calm:1, alert:0.6, excited:0.55, scared:0.65, triumphant:0.8, mysterious:1.4 };

function setTheme(key){
  const t = THEMES[key] || THEMES.default;
  scene.style.background = t.bg;
  sceneIcon.textContent = t.icon;
  sceneCaption.textContent = t.caption;
  spawnParticles(t.particle, state.mood || 'calm');
  state.theme = key;
}
function applyMood(mood){
  state.mood = mood;
  const t = THEMES[state.theme] || THEMES.default;
  spawnParticles(t.particle, mood);
  scene.classList.remove('pulse-alert','pulse-triumphant');
  void scene.offsetWidth; // restart animation even if same mood repeats
  if(mood==='alert' || mood==='scared') scene.classList.add('pulse-alert');
  else if(mood==='triumphant') scene.classList.add('pulse-triumphant');
}
function spawnParticles(kind, mood){
  scene.querySelectorAll('.particle').forEach(p=>p.remove());
  const countFactor = MOOD_PARTICLE_FACTOR[mood] || 1;
  const speedFactor = MOOD_SPEED_FACTOR[mood] || 1;
  const n = Math.round(10 * countFactor);
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = kind==='leaf' ? (6+Math.random()*6) : (2+Math.random()*3);
    p.style.width = size+'px'; p.style.height = size+'px';
    p.style.left = Math.random()*100+'%'; p.style.top = Math.random()*100+'%';
    let color = kind==='leaf' ? '#8fd19e' : kind==='wave' ? '#7fd8e8' : kind==='ember' ? '#ffb066' : '#ffffff';
    p.style.background = color;
    const dur = (3+Math.random()*4) * speedFactor;
    p.style.animation = `float ${dur}s ease-in-out infinite`;
    p.style.animationDelay = (Math.random()*3)+'s';
    scene.insertBefore(p, sceneIcon);
  }
}

// ── TTS (Google Cloud, via existing Edge Function) ───────────
// v4: speak() now returns a promise that resolves when the audio ENDS
// (or is paused, fails, or is blocked), so the silence timer starts only
// after the child actually heard the line.
let _currentAudio = null;
let _audioCtx = null;
let voiceOn = true;
const MOOD_RATE = { calm:0.88, alert:0.92, excited:0.95, scared:0.88, triumphant:0.92, mysterious:0.82 };
// ONE number to tune the whole voice speed: -0.2 = slower for young beginners. Never below 0.6.
const VOICE_SPEED_SHIFT = -0.2;
function unlockAudio(){
  if(!_audioCtx){ try{ _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume().catch(()=>{});
}
async function speak(text, mood){
  if(!voiceOn || !text) return;
  const rate = Math.max(0.6, (MOOD_RATE[mood] || 0.88) + VOICE_SPEED_SHIFT);
  try{
    if(_currentAudio){ _currentAudio.pause(); _currentAudio = null; }
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 15000);
    const res = await fetch(`${SUPABASE_URL}/functions/v1/tts`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ text, rate }),
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if(!res.ok){ console.error("TTS error:", res.status, await res.text()); return; }
    const data = await res.json();
    if(!data.audio){ console.error("TTS: no audio"); return; }
    const a = new Audio(`data:audio/mp3;base64,${data.audio}`);
    _currentAudio = a;
    await new Promise(resolve=>{
      let done = false;
      const fin = ()=>{ if(!done){ done = true; Stage.lipsStop(); resolve(); } };
      Stage.lipsFor(a, ()=> done);
      a.addEventListener('ended', fin);
      a.addEventListener('pause', fin);
      a.addEventListener('error', fin);
      setTimeout(fin, 30000); // safety net
      // never play Juno's voice while the child is recording: the mic would hear her and mix her words into the answer
      if(recording){ fin(); return; }
      const p = a.play();
      if(p !== undefined) p.catch(()=>{ state.pendingSpeech = a; fin(); });
    });
  }catch(e){ console.error("TTS fatal:", e); }
}
muteBtn.addEventListener('click', ()=>{
  voiceOn = !voiceOn;
  muteBtn.textContent = voiceOn ? '🔊' : '🔇';
  if(!voiceOn && _currentAudio) _currentAudio.pause();
});
function speakNow(btn){
  unlockAudio();
  const t = btn.getAttribute('data-text'); const m = btn.getAttribute('data-mood');
  if(!t) return;
  clearIdle(); idleLevel = 0;               // replaying a line = the child is here
  if(Stage.on) Stage.setExpr('neutral');    // an old line is replayed with her normal talking face
  const g = turnGen;
  speak(t, m).then(()=>{ if(g === turnGen) armIdle(); });
}

// ── SILENCE LADDER (v4) ──────────────────────────────────────
// Level 1 (~18s): easier question, plot does not move.
// Level 2 (~35s): one small world event.
// Level 3 (~60s): the story rests; nothing is spoken until the child taps.
// Silence turns never count as story turns (the clock at turn 8 waits).
let idleTimer = null, idleGen = 0, idleLevel = 0, idleMaxLevel = 0, asleep = false;
let silenceStartAt = 0; // when the last REAL story line finished playing
let turnGen = 0;        // bumps on every request; stale "speech ended" callbacks are ignored

function storyActive(){ return inputbar.style.display === 'flex' && state.turn > 0 && state.turn < MAX_TURNS; }
function clearIdle(){ clearTimeout(idleTimer); idleTimer = null; idleGen++; }
function armIdle(){
  clearIdle();
  if(!storyActive() || recording || sendBtn.disabled || asleep || document.hidden) return;
  if(idleLevel >= 3) return;
  const gen = idleGen;
  idleTimer = setTimeout(()=>{ if(gen === idleGen) fireIdle(idleLevel + 1); }, IDLE_DELAYS[idleLevel]);
}
function childActive(){
  if(asleep) wake(false);
  idleLevel = 0;
  armIdle();
}
function fireIdle(level){
  idleLevel = level;
  idleMaxLevel = Math.max(idleMaxLevel, level);
  if(level >= 3){ goToSleep(); return; }
  sendTurn(SILENCE_MARK, false, level);
}
function goToSleep(){
  asleep = true;
  clearIdle();
  WakeLock.off();
  Stage.setExpr('neutral');
  if(_currentAudio) _currentAudio.pause();
  // log only - the server does not generate anything for level 3
  fetch(`${SUPABASE_URL}/functions/v1/coach`, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ idle:3, sid:state.sid, turnCount:state.turn }),
  }).catch(()=>{});
  const div = document.createElement('div');
  div.className = 'msg end-card'; div.id = 'sleep-card';
  div.innerHTML = `<div class="icon">💤</div><div>The story is resting</div><button class="restart" id="wakeBtn">Continue</button>`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
  document.getElementById('wakeBtn').addEventListener('click', ()=>{ unlockAudio(); wake(true); });
}
function wake(replay){
  asleep = false;
  WakeLock.on();
  const card = document.getElementById('sleep-card');
  if(card) card.remove();
  idleLevel = 0;
  if(!replay) return;
  // replay the last story line, then start listening for silence again
  const lastLine = [...state.history].reverse().find(m=> m.role === 'assistant');
  const g = turnGen;
  if(Stage.on) Stage.setExpr('neutral');
  if(lastLine) speak(lastLine.content, state.mood).then(()=>{ if(g === turnGen) armIdle(); });
  else armIdle();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ clearIdle(); if(_currentAudio) _currentAudio.pause(); }
  else { armIdle(); if(storyActive() && !asleep) WakeLock.on(); }
});

// ── STT (Web Speech API) ─────────────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null, recording = false, silenceTimer = null, autoSendTimer = null;
const SILENCE_MS = 2200; // gives kids room to pause mid-sentence without getting cut off
if(SR){
  recognizer = new SR();
  recognizer.lang = 'en-US';
  recognizer.continuous = true;
  recognizer.interimResults = true;
  recognizer.onresult = (e)=>{
    // Android Chrome sends GROWING copies of the same phrase ("help", "help her", "help her look"),
    // desktop Chrome sends separate pieces. Merge both kinds without repeating words.
    const parts = [];
    for(let i=0;i<e.results.length;i++) parts.push(e.results[i][0].transcript);
    userInput.value = mergeTranscripts(parts);
    // every new bit of speech pushes back the "are they done?" timer
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(()=>{ if(recognizer && recording) recognizer.stop(); }, SILENCE_MS);
  };
  recognizer.onstart = ()=>{ document.getElementById('mic-hint').classList.add('visible'); };
  recognizer.onend = ()=>{
    recording=false;
    micBtn.classList.remove('listening');
    document.getElementById('mic-hint').classList.remove('visible');
    clearTimeout(silenceTimer);
    if(userInput.value.trim()) autoSendTimer = setTimeout(()=>{ autoSendTimer = null; sendBtn.click(); }, 150);
    else childActive(); // tried to talk but nothing came out - start the ladder from the bottom
  };
  recognizer.onerror = ()=>{
    recording=false; micBtn.classList.remove('listening');
    document.getElementById('mic-hint').classList.remove('visible'); clearTimeout(silenceTimer);
    childActive();
  };
}else{
  micBtn.style.opacity='.4'; micBtn.title='Voice input not supported in this browser';
}
micBtn.addEventListener('click', ()=>{
  unlockAudio();
  if(!recognizer) return;
  if(recording){ recognizer.stop(); return; } // tap again = "I'm done talking"
  // a tap right after the recording ended: send what was said, don't start a new recording over it
  if(autoSendTimer){ clearTimeout(autoSendTimer); autoSendTimer = null; sendBtn.click(); return; }
  clearIdle();
  if(asleep) wake(false);
  speechSynthesisCancelSafe();
  userInput.value = '';
  try{ recording=true; micBtn.classList.add('listening'); recognizer.start(); }
  catch(e){ recording=false; micBtn.classList.remove('listening'); childActive(); }
});
function speechSynthesisCancelSafe(){ if(_currentAudio) _currentAudio.pause(); }

function mergeTranscripts(parts){
  let out = '';
  for(const raw of parts){
    const t = (raw || '').trim();
    if(!t) continue;
    const o = out.toLowerCase(), n = t.toLowerCase();
    if(!out) out = t;
    else if(n.startsWith(o)) out = t;           // growing copy: keep the longer one
    else if(o.endsWith(n) || o.includes(n)) {}  // already have it
    else out = out + ' ' + t;                   // a new piece
  }
  return out;
}

// ── MESSAGES ──────────────────────────────────────────────────

// ── SPARK SCREEN ──────────────────────────────────────────────
function showSpark(){

let starting = false;   // a fast double-tap on the world button must not start two stories
async function startStory(themeKey, label){
  if(starting) return;
  starting = true;
  document.querySelectorAll('.chip').forEach(c=> c.disabled = true);
  Stage.enable(themeKey === 'pirate');
  WakeLock.on();
  setTheme(themeKey);
  panel.innerHTML = '';
  inputbar.style.display = 'flex';
  state.turn = 0;
  state.history = [];
  state.world = themeKey;
  state.sid = newSid();
  idleLevel = 0; idleMaxLevel = 0; asleep = false;
  try{ await sendTurn(`I want a ${label} story.`, true); }
  finally{ starting = false; }
}

function continueSession(){
  const last = loadLastSession();
  if(!last) return;
  state = {
    turn:last.turn, theme:last.theme||'default', mood:'calm', history:last.history,
    world:last.world || null, sid:last.sid || newSid(),
  };
  panel.innerHTML = '';
  inputbar.style.display = 'flex';
  Stage.enable(state.world === 'pirate' || (!state.world && state.history.some(m=> /\bJuno\b/.test(m.content))));
  WakeLock.on();
  setTheme(state.theme);
  renderThread();
  state.history.forEach(m=>{
    if(m.role === 'user'){ if(m.content !== SILENCE_MARK) addUserSilent(m.content); }
    else addNarratorSilent(m.content);
  });
  panel.scrollTop = panel.scrollHeight;
  idleLevel = 0; idleMaxLevel = 0; asleep = false;
  silenceStartAt = Date.now();
  if(state.turn >= MAX_TURNS) endStory();
  else armIdle();
}
function addUserSilent(text){ const wrap=document.createElement('div'); wrap.className='msg user-line'; const b=document.createElement('div'); b.className='user-bubble'; b.textContent=text; wrap.appendChild(b); panel.appendChild(wrap); }
function addNarratorSilent(text){ const div=document.createElement('div'); div.className='msg narrator'; div.textContent=text; panel.appendChild(div); }

// ── CORE TURN LOOP ────────────────────────────────────────────
// idle = 0 for a real turn, 1 or 2 for a silence nudge.
async function sendTurn(userText, isFirst, idle = 0){
  clearIdle();
  const myGen = ++turnGen;
  if(asleep) wake(false);
  const isReal = !idle;
  let bubble = null;
  if(isReal && !isFirst) bubble = addUser(userText);
  state.history.push({ role:'user', content:userText });
  if(isReal){ state.turn++; renderThread(); }
  addTyping();
  sendBtn.disabled = true;
  micBtn.disabled = true;

  const payload = {
    history: state.history.slice(-8),
    turnCount: state.turn,
    maxTurns: MAX_TURNS,
    world: state.world,
    sid: state.sid,
  };
  if(idle) payload.idle = idle;
  if(isReal && !isFirst){
    payload.afterIdle = idleMaxLevel;
    payload.silentMs = silenceStartAt ? Date.now() - silenceStartAt : 0;
  }

  let spoken = null;
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/coach`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    const HOLD_MS = { calm:0, mysterious:200, alert:450, scared:450, triumphant:350, excited:150 };
    let hold = HOLD_MS[data.mood] || 0;
    if(Stage.on){
      Stage.setExpr(data.expression);   // the face reacts first...
      hold = Math.max(hold, 400);       // ...and the voice comes a moment later
    }
    if(hold) await new Promise(r=> setTimeout(r, hold));
    removeTyping();
    if(Stage.on) Stage.fx(data.effect);

    const theme = THEMES[data.theme] ? data.theme : state.theme;
    setTheme(theme);
    applyMood(data.mood);
    state.history.push({ role:'assistant', content:data.message });
    if(isReal){ idleLevel = 0; idleMaxLevel = 0; }
    saveSession();
    spoken = addNarrator(data.message, data.mood);

    if(state.turn >= MAX_TURNS) endStory();
  }catch(e){
    removeTyping();
    if(isReal && isFirst){
      // keep the world pick in history (same as v3) so the next message still opens the story
      addNarratorSilent("(The story pauses for a moment... try sending your message again.)");
    } else {
      // undo this attempt so a resend does not duplicate it
      state.history.pop();
      if(isReal){
        state.turn--; renderThread();
        if(bubble) bubble.remove();
        userInput.value = userText;
        addNarratorSilent("(The story pauses for a moment... try sending your message again.)");
      }
    }
  }
  sendBtn.disabled = false;
  micBtn.disabled = false;

  if(spoken){
    spoken.then(()=>{
      if(myGen !== turnGen) return; // a newer turn already started
      Stage.settle();
      if(isReal) silenceStartAt = Date.now();
      armIdle();
    });
  } else if(!isReal && myGen === turnGen){
    armIdle(); // a failed nudge just moves on to the next rung
  }
}

function endStory(){
  clearIdle();
  WakeLock.off();
  inputbar.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg end-card';
  div.innerHTML = `<div class="icon">✨</div><div>Episode complete!</div><button class="restart" id="restartBtn">New story</button>`;
  panel.appendChild(div);
  panel.scrollTop = panel.scrollHeight;
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    state = { turn:0, theme:'default', mood:'calm', history:[], world:null, sid:null };
    clearSession();
    showSpark();
  });
}

sendBtn.addEventListener('click', ()=>{
  const val = userInput.value.trim();
  if(!val || sendBtn.disabled) return;
  userInput.value = '';
  sendTurn(val, false);
});
userInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') sendBtn.click(); });
userInput.addEventListener('input', childActive);

// ── KEYBOARD: size the card to the visible part of the screen ──
// When the phone keyboard opens, the visible area shrinks. We size the card to it,
// so the stage (Juno) stays on screen above the keyboard instead of scrolling away.
(function(){
  const vv = window.visualViewport;
  const appEl = document.getElementById('app');
  const fullH = Math.max(window.innerHeight, screen.height * 0.6);
  function fit(){
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--vvh', h + 'px');
    const kb = h < fullH * 0.75;                 // a big drop in height = keyboard is open
    document.body.classList.toggle('kb', kb);
    appEl.classList.toggle('kb', kb);
    if(kb) window.scrollTo(0, 0);
    if(window.Stage) requestAnimationFrame(()=> window.Stage.relayout());
  }
  if(vv){ vv.addEventListener('resize', fit); vv.addEventListener('scroll', ()=>{ if(document.body.classList.contains('kb')) window.scrollTo(0,0); }); }
  window.addEventListener('resize', fit);
  fit();
})();

// ── WAKE LOCK: keep the screen on while the story is active ──
const WakeLock = (()=>{
  let lock = null, want = false;
  async function grab(){
    if(!want || lock || document.hidden || !('wakeLock' in navigator)) return;
    try{ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', ()=>{ lock = null; }); }
    catch(e){ lock = null; }
  }
  return {
    on(){ want = true; grab(); },
    off(){ want = false; if(lock){ lock.release().catch(()=>{}); lock = null; } },
  };
})();

// ── STAGE: animated Juno in the captain's cabin (pirate world) ──
const Stage = (()=>{
  const EXPR = ['neutral','happy','excited','surprised','scared','sad','confess','shy'];
  const HEAVY = ['confess'];                       // only the confession stays until the next turn
  const el = id => document.getElementById(id);
  const stage = el('stage'), world = el('stWorld'), holder = el('stR');
  const emote = el('stE'), bob = el('stB'), glow = el('stGlow'), dark = el('stDark');
  const shakeL = el('stShake'), zoomL = el('stZoom'), flash = el('stFlash');
  const dust = el('stDust'), dctx = dust.getContext('2d');
  const imgs = {};
  let loaded = false, on = false, current = 'neutral', mouthOpen = false, blinking = false;
  let settleTimer = 0, rafLips = 0, fakeTimer = 0, motes = [], lanternOn = true;

  function load(){
    if(loaded) return; loaded = true;
    el('stBg').src = 'cabin.webp';
    [...EXPR, 'talk', 'blink'].forEach(k=>{
      const im = new Image();
      im.className = 'spr' + (k === 'talk' || k === 'blink' ? ' instant' : '');
      im.alt = ''; im.src = `juno-${k}.webp`;
      imgs[k] = im; holder.appendChild(im);
    });
    scheduleBlink(); flicker(); requestAnimationFrame(drawDust);
  }
  function layout(){
    if(!on) return;
    const bw = stage.clientWidth, bh = stage.clientHeight;
    if(!bw || !bh) return;
    const w = Math.max(bw, bh * 0.75), h = w * 4 / 3;
    world.style.width = w + 'px'; world.style.height = h + 'px';
    world.style.left = ((bw - w) / 2) + 'px';
    // Prefer showing Juno whole (feet in view). If the box is too short for that
    // (keyboard open), keep her head in view instead - the face matters more than the feet.
    let top = Math.min(0, Math.max(bh - h, bh - h * 0.965));
    const junoTop = w * 0.328;                     // her head, in world pixels (from the sprite placement)
    if(top + junoTop < 0) top = Math.min(0, Math.max(bh - h, bh * 0.10 - junoTop));
    world.style.top = top + 'px';
    const r = Math.min(window.devicePixelRatio || 1, 2);
    dust.width = Math.round(w * r * 0.5); dust.height = Math.round(h * r * 0.5);
    motes = Array.from({length: 36}, ()=> mote(true));
  }
  function enable(v){
    on = !!v;
    document.getElementById('app').classList.toggle('stage-mode', on);
    if(on){ load(); setExpr('neutral'); requestAnimationFrame(layout); }
  }
  function setExpr(k){
    if(!loaded) return;
    if(!EXPR.includes(k)) k = 'neutral';
    clearTimeout(settleTimer);
    current = k;
    EXPR.forEach(e => imgs[e].style.opacity = (e === k ? 1 : 0));
    imgs.talk.style.opacity = 0; imgs.blink.style.opacity = 0; mouthOpen = false; blinking = false;
    emote.className = 'jE'; void emote.offsetWidth;
    if(k !== 'neutral') emote.className = 'jE e-' + k;
    holder.classList.toggle('slow', k === 'sad' || k === 'confess');
  }
  // after Juno finishes speaking: light feelings fade back to neutral
  function settle(){
    clearTimeout(settleTimer);
    if(!on || current === 'neutral' || HEAVY.includes(current)) return;
    settleTimer = setTimeout(()=> setExpr('neutral'), current === 'sad' ? 4000 : 2500);
  }
  function setMouth(open){
    if(open === mouthOpen) return;
    mouthOpen = open;
    if(current === 'neutral' && !blinking) imgs.talk.style.opacity = open ? 1 : 0;
  }
  function setBob(level){ bob.style.translate = `0 ${(-level * 0.9).toFixed(3)}%`; }
  function blinkOnce(){
    if(!on || current !== 'neutral' || mouthOpen) return;
    blinking = true; imgs.blink.style.opacity = 1;
    setTimeout(()=>{ imgs.blink.style.opacity = 0; blinking = false; }, 110);
  }
  function scheduleBlink(){
    setTimeout(()=>{ blinkOnce(); if(Math.random() < 0.18) setTimeout(blinkOnce, 260); scheduleBlink(); }, 2400 + Math.random() * 3600);
  }
  // lips follow the real voice when the audio context runs; otherwise a fake syllable pattern
  // Open-mouthed faces (laugh, "oh!") have no talking frames. So she REACTS first
  // (the face shows while the line loads), and when the voice starts she switches
  // to her talking face, so the mouth moves with the words instead of freezing open.
  const REACT_THEN_TALK = ['happy','excited','surprised','shy'];
  function lipsFor(audio, isDone){
    if(!on) return;
    lipsStop();
    if(REACT_THEN_TALK.includes(current)) setExpr('neutral');
    if(_audioCtx && _audioCtx.state === 'running'){
      try{
        const src = _audioCtx.createMediaElementSource(audio);
        const an = _audioCtx.createAnalyser(); an.fftSize = 1024;
        src.connect(an); an.connect(_audioCtx.destination);
        const buf = new Float32Array(an.fftSize);
        let last = 0, smooth = 0;
        const tick = (t)=>{
          if(isDone()){ setMouth(false); setBob(0); return; }
          an.getFloatTimeDomainData(buf);
          let sum = 0; for(let i=0;i<buf.length;i++) sum += buf[i]*buf[i];
          smooth = smooth * 0.6 + Math.sqrt(sum / buf.length) * 0.4;
          if(t - last > 70){
            if(!mouthOpen && smooth > 0.045){ setMouth(true); last = t; }
            else if(mouthOpen && smooth < 0.025){ setMouth(false); last = t; }
          }
          setBob(Math.min(1, smooth * 8));
          rafLips = requestAnimationFrame(tick);
        };
        rafLips = requestAnimationFrame(tick);
        return;
      }catch(e){ /* fall through to fake lips */ }
    }
    let i = 0;
    const step = ()=>{
      if(isDone()){ setMouth(false); setBob(0); return; }
      const open = i++ % 2 === 0;
      setMouth(open); setBob(open ? 0.6 + Math.random() * 0.4 : 0.1);
      fakeTimer = setTimeout(step, open ? 110 + Math.random() * 90 : 60 + Math.random() * 70);
    };
    step();
  }
  function lipsStop(){ cancelAnimationFrame(rafLips); clearTimeout(fakeTimer); if(loaded){ setMouth(false); setBob(0); } }
  function fx(name){
    if(!on || !name || name === 'none') return;
    if(name === 'shake'){ shakeL.classList.remove('on'); void shakeL.offsetWidth; shakeL.classList.add('on'); }
    if(name === 'lightning'){ flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on'); setTimeout(()=> fx('shake'), 120); }
    if(name === 'lantern'){ lanternOn = false; glow.style.opacity = 0; dark.style.opacity = 1; setTimeout(()=>{ dark.style.opacity = 0; lanternOn = true; }, 2600); }
    if(name === 'zoom'){ zoomL.classList.add('close'); setTimeout(()=> zoomL.classList.remove('close'), 9000); }
  }
  function flicker(){ if(lanternOn) glow.style.opacity = (0.78 + Math.random() * 0.22).toFixed(2); setTimeout(flicker, 80 + Math.random() * 140); }
  function mote(anywhere){
    const W = dust.width || 1, H = dust.height || 1, k = W / 450;
    return { x: W * (0.15 + Math.random() * 0.5), y: anywhere ? H * Math.random() * 0.75 : H * 0.12, r: (0.6 + Math.random() * 1.6) * k,
             vx: (Math.random() - 0.5) * 0.08 * k, vy: (0.03 + Math.random() * 0.07) * k, a: 0.15 + Math.random() * 0.35, p: Math.random() * 6.28 };
  }
  function drawDust(){
    if(on && !document.hidden){
      const W = dust.width, H = dust.height;
      dctx.clearRect(0, 0, W, H);
      for(const m of motes){
        m.x += m.vx + Math.sin(m.p += 0.01) * 0.05; m.y += m.vy;
        if(m.y > H * 0.8 || m.x < 0 || m.x > W) Object.assign(m, mote(false));
        dctx.globalAlpha = lanternOn ? m.a : m.a * 0.15; dctx.fillStyle = '#ffe2a8';
        dctx.beginPath(); dctx.arc(m.x, m.y, m.r, 0, 6.283); dctx.fill();
      }
    }
    requestAnimationFrame(drawDust);
  }
  window.addEventListener('resize', layout);
  return { enable, setExpr, settle, lipsFor, lipsStop, fx, relayout: layout, get on(){ return on; } };
})();
window.Stage = Stage;

// ── SESSION PERSISTENCE (silent, no UI exposure) ─────────────
const SESSION_KEY = 'fluency_story_session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ turn:state.turn, theme:state.theme, world:state.world, sid:state.sid, history:state.history, savedAt:new Date().toISOString() })); }catch(e){}
}
function loadLastSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

if(window.speechSynthesis) speechSynthesis.getVoices();
</script>
